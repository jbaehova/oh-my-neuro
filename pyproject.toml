[project]
name = "oh-my-neuro"
version = "0.4.0"
description = "Local RAG document search system — LangGraph Corrective RAG + FastAPI/React"
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "OH-MY-NEURO Team" },
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "tenacity>=8.2",
  "openai>=2.0,<3.0",
  "tiktoken>=0.7",
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langchain-community>=0.4,<1.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langchain-chroma>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-mcp-adapters>=0.2,<1.0",
  "chromadb>=1.0,<2.0",
  "PyMuPDF>=1.23",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
  "ruff>=0.6",
]

[project.scripts]
oh-my-neuro = "app.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "data*", "configs*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
