servers:
  korean_law:
    transport: stdio
    command: uvx
    args:
      - korean-law-mcp
    env:
      OPEN_LAW_ID: $OPEN_LAW_ID
    enabled: true
  web_search:
    transport: stdio
    command: uvx
    args:
      - duckduckgo-mcp-server
    env:
      DDG_REGION: kr-kr
      DDG_SAFE_SEARCH: moderate
    enabled: true
